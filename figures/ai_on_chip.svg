<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Illustration: detector signals processed by AI on a chip</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#0d3b48"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>

  <g transform="translate(380 300) scale(1.12) translate(-400 -300)">
  <!-- Detector: concentric layers around a collision point -->
  <g fill="none" stroke="#7fd6cf" stroke-width="2" opacity="0.55">
    <path d="M 120 240 A 60 60 0 0 1 120 360"/>
    <path d="M 120 200 A 100 100 0 0 1 120 400"/>
    <path d="M 120 160 A 140 140 0 0 1 120 440"/>
    <path d="M 120 240 A 60 60 0 0 0 120 360" opacity="0.35"/>
    <path d="M 120 200 A 100 100 0 0 0 120 400" opacity="0.35"/>
  </g>
  <!-- Particle tracks -->
  <g fill="none" stroke="#f5cf5a" stroke-width="2.5" stroke-linecap="round">
    <path d="M 120 300 Q 190 270 255 215"/>
    <path d="M 120 300 Q 200 300 260 300"/>
    <path d="M 120 300 Q 185 340 250 395"/>
  </g>
  <circle cx="120" cy="300" r="6" fill="#ffffff" filter="url(#glow)"/>
  <!-- Hits on the outer layer -->
  <g fill="#ffffff">
    <circle cx="255" cy="215" r="5"/>
    <circle cx="260" cy="300" r="5"/>
    <circle cx="250" cy="395" r="5"/>
  </g>

  <!-- Signal lines with pulses, from detector to chip -->
  <g fill="none" stroke="#00c2b3" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 262 215 L 285 215 L 292 195 L 300 238 L 307 215 L 330 230"/>
    <path d="M 266 300 L 288 300 L 295 280 L 303 322 L 310 300 L 330 300"/>
    <path d="M 256 395 L 282 395 L 289 375 L 297 418 L 304 395 L 330 370"/>
  </g>

  <!-- Chip -->
  <g>
    <g fill="#7fd6cf" opacity="0.85">
      <!-- pins top -->
      <rect x="362" y="162" width="10" height="20" rx="2"/>
      <rect x="398" y="162" width="10" height="20" rx="2"/>
      <rect x="434" y="162" width="10" height="20" rx="2"/>
      <rect x="470" y="162" width="10" height="20" rx="2"/>
      <rect x="506" y="162" width="10" height="20" rx="2"/>
      <rect x="542" y="162" width="10" height="20" rx="2"/>
      <!-- pins bottom -->
      <rect x="362" y="418" width="10" height="20" rx="2"/>
      <rect x="398" y="418" width="10" height="20" rx="2"/>
      <rect x="434" y="418" width="10" height="20" rx="2"/>
      <rect x="470" y="418" width="10" height="20" rx="2"/>
      <rect x="506" y="418" width="10" height="20" rx="2"/>
      <rect x="542" y="418" width="10" height="20" rx="2"/>
      <!-- pins left -->
      <rect x="312" y="215" width="20" height="10" rx="2"/>
      <rect x="312" y="260" width="20" height="10" rx="2"/>
      <rect x="312" y="295" width="20" height="10" rx="2"/>
      <rect x="312" y="330" width="20" height="10" rx="2"/>
      <rect x="312" y="365" width="20" height="10" rx="2"/>
      <!-- pins right -->
      <rect x="568" y="225" width="20" height="10" rx="2"/>
      <rect x="568" y="262" width="20" height="10" rx="2"/>
      <rect x="568" y="295" width="20" height="10" rx="2"/>
      <rect x="568" y="328" width="20" height="10" rx="2"/>
      <rect x="568" y="365" width="20" height="10" rx="2"/>
    </g>
    <rect x="330" y="180" width="240" height="240" rx="20" fill="#0f2c40" stroke="#00c2b3" stroke-width="3"/>
    <rect x="348" y="198" width="204" height="204" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

    <!-- Neural network inside the chip -->
    <g stroke="#7fd6cf" stroke-width="1.6" opacity="0.6">
      <!-- layer 1 -> layer 2 -->
      <line x1="385" y1="250" x2="450" y2="232"/><line x1="385" y1="250" x2="450" y2="278"/><line x1="385" y1="250" x2="450" y2="322"/><line x1="385" y1="250" x2="450" y2="368"/>
      <line x1="385" y1="300" x2="450" y2="232"/><line x1="385" y1="300" x2="450" y2="278"/><line x1="385" y1="300" x2="450" y2="322"/><line x1="385" y1="300" x2="450" y2="368"/>
      <line x1="385" y1="350" x2="450" y2="232"/><line x1="385" y1="350" x2="450" y2="278"/><line x1="385" y1="350" x2="450" y2="322"/><line x1="385" y1="350" x2="450" y2="368"/>
      <!-- layer 2 -> layer 3 -->
      <line x1="450" y1="232" x2="515" y2="275"/><line x1="450" y1="232" x2="515" y2="325"/>
      <line x1="450" y1="278" x2="515" y2="275"/><line x1="450" y1="278" x2="515" y2="325"/>
      <line x1="450" y1="322" x2="515" y2="275"/><line x1="450" y1="322" x2="515" y2="325"/>
      <line x1="450" y1="368" x2="515" y2="275"/><line x1="450" y1="368" x2="515" y2="325"/>
    </g>
    <g fill="#f5cf5a" filter="url(#glow)">
      <circle cx="385" cy="250" r="9"/><circle cx="385" cy="300" r="9"/><circle cx="385" cy="350" r="9"/>
      <circle cx="450" cy="232" r="9"/><circle cx="450" cy="278" r="9"/><circle cx="450" cy="322" r="9"/><circle cx="450" cy="368" r="9"/>
      <circle cx="515" cy="275" r="9"/><circle cx="515" cy="325" r="9"/>
    </g>
  </g>

  <!-- Output to a physics result (histogram with a peak) -->
  <g fill="none" stroke="#00c2b3" stroke-width="2.5" stroke-linecap="round">
    <path d="M 588 300 L 630 300"/>
  </g>
  <g>
    <line x1="645" y1="380" x2="765" y2="380" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="645" y1="380" x2="645" y2="240" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <g fill="#00a99d" opacity="0.9">
      <rect x="652" y="362" width="13" height="18"/>
      <rect x="668" y="352" width="13" height="28"/>
      <rect x="684" y="334" width="13" height="46"/>
      <rect x="716" y="334" width="13" height="46"/>
      <rect x="732" y="352" width="13" height="28"/>
      <rect x="748" y="362" width="13" height="18"/>
    </g>
    <rect x="700" y="262" width="13" height="118" fill="#f5cf5a" filter="url(#glow)"/>
  </g>
  </g>
</svg>
